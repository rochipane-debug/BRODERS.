<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Solicitá tu reserva en BRODERS, Av. del Puerto 925, Tigre." />
  <title>RESERVAS | BRODERS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="BRODERS.css" />
</head>
<body class="page-interna page-reservas">

  <!-- HEADER / NAVEGACIÓN (idéntico en las 6 páginas)
       Desktop: logo izq + links + icono usuario der
       Mobile:  hamburguesa izq + logo centro + icono usuario der -->
  <header class="header" id="header">
    <div class="header__inner">

      <button class="header__burger" id="burgerBtn" aria-label="Abrir menú" aria-expanded="false" aria-controls="drawer">
        <span></span><span></span><span></span>
      </button>

      <a href="index.html" class="header__logo" aria-label="BRODERS - Inicio">
        <img src="./imagenes/logo%20broders.jpg" alt="BRODERS" />
      </a>

      <nav class="header__nav" aria-label="Navegación principal">
        <a href="menu.html">MENÚ</a>
        <a href="nosotros.html">SOBRE NOSOTROS</a>
        <a href="galeria.html">GALERÍA</a>
        <a href="reservas.html" aria-current="page">RESERVAS</a>
        <a href="contacto.html">CONTACTO</a>
      </nav>

      <button class="header__user" aria-label="Cuenta de usuario" title="Cuenta de usuario (no disponible)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
        </svg>
      </button>
    </div>
  </header>

  <!-- PANEL LATERAL MOBILE (drawer) -->
  <div class="drawer-overlay" id="drawerOverlay" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Menú de navegación móvil">
    <div class="drawer__head">
      <img src="./imagenes/logo%20broders.jpg" alt="BRODERS" class="drawer__logo" />
      <button class="drawer__close" id="drawerClose" aria-label="Cerrar menú">&times;</button>
    </div>
    <nav class="drawer__nav">
      <a href="index.html">INICIO</a>
      <a href="menu.html">MENÚ</a>
      <a href="nosotros.html">SOBRE<br>NOSOTROS</a>
      <a href="galeria.html">GALERÍA</a>
      <a href="reservas.html" aria-current="page">RESERVAS</a>
      <a href="contacto.html">CONTACTO</a>
    </nav>
  </aside>

  <main>

    <section id="reservas" class="section section--reservas">
      <h2 class="section__title section__title--reservas">RESERVAS</h2>
      <div class="reservas">

        <!-- Mapa (solo desktop) -->
        <div class="reservas__map">
          <img src="./imagenes/p5_img2.png" alt="Ubicación de BRODERS en Tigre, Nordelta" />
          <a class="reservas__map-link" href="https://maps.google.com/?q=Av+Del+Puerto+925+Tigre" target="_blank" rel="noopener">
            AV DEL PUERTO 925 - TIGRE
          </a>
        </div>

        <!-- Formulario de reservas -->
        <form class="reservas__form" id="reservaForm" novalidate>

          <div class="field">
            <label for="fecha">FECHA</label>
            <input type="date" id="fecha" name="fecha" required />
            <small class="field__error" data-error-for="fecha"></small>
          </div>

          <div class="field">
            <label for="ubicacion">UBICACIÓN</label>
            <select id="ubicacion" name="ubicacion" required>
              <option value="" disabled selected>Elegí una opción</option>
              <option value="ADENTRO">ADENTRO</option>
              <option value="AFUERA">AFUERA</option>
            </select>
            <small class="field__error" data-error-for="ubicacion"></small>
          </div>

          <div class="field">
            <label for="personas">NÚMERO DE PERSONAS</label>
            <select id="personas" name="personas" required>
              <option value="" disabled selected>Elegí la cantidad</option>
              <option value="1">1 PERSONA</option>
              <option value="2">2 PERSONAS</option>
              <option value="3">3 PERSONAS</option>
              <option value="4">4 PERSONAS</option>
              <option value="5">5 PERSONAS</option>
              <option value="6">6 PERSONAS</option>
              <option value="7">7 PERSONAS</option>
              <option value="8">8 PERSONAS</option>
              <option value="9">9 PERSONAS</option>
              <option value="10+">10 O MÁS</option>
            </select>
            <small class="field__error" data-error-for="personas"></small>
          </div>

          <div class="field">
            <label for="hora">HORA</label>
            <select id="hora" name="hora" required>
              <option value="" disabled selected>Elegí un horario</option>
              <option value="1">13:00</option>
              <option value="2">14:00</option>
              <option value="3">15:00</option>
              <option value="4">16:00</option>
              <option value="5">17:00</option>
              <option value="6">18:00</option>
              <option value="7">19:00</option>
              <option value="8">20:00</option>
              <option value="9">21:00</option>
              <option value="10">22:00</option>
              <option value="11">23:00</option>
            </select>
            <small class="field__error" data-error-for="hora"></small>
          </div>

          <button type="submit" class="btn btn--submit">SOLICITAR RESERVA</button>

          <!-- Mensaje de confirmación -->
          <p class="form-msg" id="formMsg" role="status" aria-live="polite"></p>
        </form>

      </div>
    </section>

  </main>

  <footer class="footer">
    <p>© <span id="year"></span> BRODERS — Bar &amp; Cervecería Artesanal · Nordelta, Argentina</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
